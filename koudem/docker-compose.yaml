#=========================================


services:
  db_postgres:
    image: postgres:14.3
    env_file:
    - .env

    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=koudem_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=gordo1968
      
    ports:
      - "5432:5432"
     

  django_app:
    build: .
    env_file:
      - .env
    volumes:
      - static:/code/static
      - .:/code
    depends_on:
      - db_postgres

  nginx:
    image: nginx:1.13
    env_file:
      - .env
    ports:
      - 8000:80
    volumes:
      - ./config/nginx/conf.d:/etc/nginx/conf.d
      - static:/code/static
    depends_on:
      - django_app


volumes:
  .:
  postgres_data:
  static:
