{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" 
        rel="stylesheet">
        <link rel="stylesheet" href="{% static 'styles/bases/style.css' %}">

    
</head>


<header>
    <div class="header-container">
        <div class="logo">
            <a  href="{% url "portal" %}">MiLogo</a>
        </div>
        <nav class="nav-menu">
            <ul>
                <li><a href="{% url 'vision' %}">Vision</a></li>
                <li><a href="{% url 'mision' %}">Mision</a></li>
                <li><a href="/services">Servicios</a></li>
                <li><a href="/contact">Contacto</a></li>
                <li><a href="{% url 'view_profile' %}">Perfil</a></li>
                {% if request.user.is_authenticated %}

                    <li><a href="{% url "exit" %}">Salir</a></li>
                {% else %}
        
                    <li><a href="{% url "custom_login" %}">Login</a></li>
                    <li><a href="{% url "register" %}">Sign Up</a></li>
                {% endif %}

                
            </ul>
        </nav>
    </div>
</header>

   
    {% block content %}{% endblock %}

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

            {% if messages %}
                <script>
                    {% for message in messages %}
                        Swal.fire({
                            title: "{{ message.tags|capfirst }}",
                            text: "{{ message }}",
                            icon: "{{ message.tags }}",
                            confirmButtonText: "OK",
                            timer: 5000,
                            timerProgressBar: true
                        });
                    {% endfor %}
                </script>
            {% endif %}


</html>
