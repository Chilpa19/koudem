<!-- templates/checkout/embedded_checkout.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Checkout - {{ course.name }}</title>
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        .checkout-container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        
        .course-info {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        
        .course-image {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            margin-right: 20px;
        }
        
        .course-details h2 {
            margin: 0 0 10px 0;
            color: #333;
        }
        
        .course-price {
            font-size: 24px;
            font-weight: bold;
            color: #0066cc;
        }
        
        #checkout {
            margin-top: 30px;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            color: #666;
        }
        
        .error {
            color: #d63384;
            background: #f8d7da;
            padding: 15px;
            border-radius: 4px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="checkout-container">
        <!-- Información del curso -->
        <div class="course-info">
            {% if course.image %}
                <img src="{{ course.image.url }}" alt="{{ course.name }}" class="course-image">
            {% endif %}
            <div class="course-details">
                <h2>{{ course.name }}</h2>
                <div class="course-price">${{ course.cost }}</div>
            </div>
        </div>
        
        <!-- Checkout embedded -->
        <div id="checkout">
            <div class="loading">Cargando checkout...</div>
        </div>
        
        <div id="error-message" class="error" style="display: none;"></div>
    </div>

    <script>
        const stripe = Stripe('{{ stripe_publishable_key }}');
        
        let elements;
        
        initialize();
        
        async function initialize() {
            try {
                // Crear sesión de checkout
                const response = await fetch(`/api/create-checkout-session/{{ course.slug }}/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                });
                
                const { clientSecret, error } = await response.json();
                
                if (error) {
                    showError(error);
                    return;
                }
                
                // Configurar Stripe Elements
                elements = stripe.elements({ clientSecret });
                
                const checkoutElement = elements.create('payment', {
                    layout: 'tabs'
                });
                
                checkoutElement.mount('#checkout');
                
            } catch (error) {
                showError('Error al cargar el checkout: ' + error.message);
            }
        }
        
        async function handleSubmit(event) {
            event.preventDefault();
            
            const { error } = await stripe.confirmPayment({
                elements,
                confirmParams: {
                    return_url: `${window.location.origin}/checkout/return/{{ course.slug }}/`
                }
            });
            
            if (error) {
                showError(error.message);
            }
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            
            document.getElementById('checkout').innerHTML = '<div class="loading">Error al cargar</div>';
        }
        
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    </script>
</body>
</html>
