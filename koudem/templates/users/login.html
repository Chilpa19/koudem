{% extends "include/base_auth.html" %}

<!DOCTYPE html>
<title>Formulario de Contacto</title>
    
{% block content %}
    {% include 'include/messaging.html' %}

    <form method="post" class="mt-4">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">Login</button>
    </form>

    <div class="mt-3">
        <p>Already have an account? <a href="{% url 'register' %}">Sign up</a></p>
        <p><a href="{% url 'password_resete' %}">Reset password</a></p>
    </div>
{% endblock %}
